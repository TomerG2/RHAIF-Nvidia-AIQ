---
- name: Apply any early bootstrap secrets before late loading
  ansible.builtin.import_playbook: rhvp.cluster_utils.load_bootstrap_secrets

- name: Load pattern secrets without rotating existing generated passwords
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - role: rhvp.cluster_utils.pattern_settings
  tasks:
    - name: Load late-phase secrets when enabled
      when: not (values_global.global.secretLoader.disabled | default(false) | bool)
      block:
        - name: Use standard loader for non-Vault backends
          ansible.builtin.include_role:
            name: rhvp.cluster_utils.load_secrets
          when: values_global.global.secretStore.backend | default('vault') != 'vault'
        - name: Load Vault secrets with generated fields first
          when: values_global.global.secretStore.backend | default('vault') == 'vault'
          block:
            - name: Check cluster prerequisites
              ansible.builtin.include_role:
                name: rhvp.cluster_utils.cluster_pre_check
            - name: Read the private secret file
              ansible.builtin.include_role:
                name: rhvp.cluster_utils.find_vp_secrets
                apply:
                  no_log: true
              no_log: true
            - name: Parse secrets with password-preserving field order
              rhvp.cluster_utils.parse_secrets_info:
                values_secrets_plaintext: "{{ values_secrets_data | aiq_preserve_generated_secrets }}"
                secrets_backing_store: vault
                secrets_phase: late
              register: aiq_secret_results
              no_log: true
            - name: Inject parsed secrets through the utility Vault loader
              ansible.builtin.include_role:
                name: rhvp.cluster_utils.vault_utils
                tasks_from: push_parsed_secrets.yaml
                apply:
                  no_log: true
              vars:
                vault_policies: "{{ aiq_secret_results.vault_policies }}"
                parsed_secrets: "{{ aiq_secret_results.parsed_secrets }}"
                unique_vault_prefixes: "{{ aiq_secret_results.unique_vault_prefixes | default([]) }}"
              no_log: true
