# Partial SSA updates only these cache-agent fields. The admission handler
# preserves them during subsequent operator reconciliation.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kserve-localmodelnode-agent
  namespace: {{ .Values.global.modelCache.jobNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: ServerSideApply=true,Validate=false,Prune=false,Delete=false
spec:
  template:
    metadata:
      annotations:
        aiq.rhai.redhat.com/cache-configuration: {{ .Values.global | toJson | sha256sum | quote }}
    spec:
      tolerations:
        {{- toYaml .Values.global.serving.tolerations | nindent 8 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: inferenceservice-config
  namespace: {{ .Values.global.modelCache.jobNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: ServerSideApply=true,Prune=false,Delete=false
data:
  localModel: {{ dict "enabled" true "fsGroup" 1000 "jobNamespace" .Values.global.modelCache.jobNamespace "defaultJobImage" .Values.global.modelTools.image "localModelAgentImage" .Values.global.rhoai.localModelAgentImage "localModelAgentCpuRequest" "100m" "localModelAgentCpuLimit" "100m" "localModelAgentMemoryRequest" "200Mi" "localModelAgentMemoryLimit" "300Mi" | toJson | quote }}
---
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: aiq-model-cache-reader
  annotations:
    argocd.argoproj.io/sync-wave: "0"
allowPrivilegedContainer: false
allowPrivilegeEscalation: false
allowHostDirVolumePlugin: false
allowHostIPC: false
allowHostNetwork: false
allowHostPID: false
allowHostPorts: false
requiredDropCapabilities: [ALL]
runAsUser: {type: MustRunAsRange}
fsGroup:
  type: MustRunAs
  ranges: [{min: 1000, max: 1000}]
supplementalGroups:
  type: RunAsAny
seLinuxContext: {type: MustRunAs}
seccompProfiles: [runtime/default]
readOnlyRootFilesystem: false
groups: []
volumes: [configMap, emptyDir, persistentVolumeClaim, projected, secret]
users:
  - system:serviceaccount:{{ .Values.global.modelCache.jobNamespace }}:aiq-model-reader
  - system:serviceaccount:{{ .Values.global.inference.namespace }}:aiq-model-reader
