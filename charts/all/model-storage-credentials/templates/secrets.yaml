{{- range $namespace := list "aiq-model-storage" $.Values.global.inference.namespace $.Values.global.modelCache.jobNamespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $.Values.global.modelStore.caConfigMap }}
  namespace: {{ $namespace }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aiq-model-reader
  namespace: {{ $namespace }}
automountServiceAccountToken: false
secrets:
  - name: model-reader
{{- $identities := list "model-reader" }}
{{- if eq $namespace "aiq-model-storage" }}
{{- $identities = list "rustfs-admin" "model-publisher" "model-reader" }}
{{- else if eq $namespace $.Values.global.inference.namespace }}
{{- $identities = list "model-publisher" "model-reader" }}
{{- end }}
{{- range $identity := $identities }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $identity }}
  namespace: {{ $namespace }}
spec:
  refreshInterval: 15s
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: {{ $identity }}
    creationPolicy: Owner
    deletionPolicy: Retain
    {{- if eq $identity "model-reader" }}
    template:
      metadata:
        annotations:
          serving.kserve.io/s3-endpoint: {{ trimPrefix "https://" $.Values.global.modelStore.endpoint | quote }}
          serving.kserve.io/s3-usehttps: "1"
          serving.kserve.io/s3-region: {{ $.Values.global.modelStore.region | quote }}
          serving.kserve.io/s3-useanoncredential: "false"
          serving.kserve.io/s3-cabundle-configmap: {{ $.Values.global.modelStore.caConfigMap | quote }}
          serving.kserve.io/s3-cabundle: /etc/ssl/custom-certs/ca.crt
      data:
        AWS_ACCESS_KEY_ID: {{ "{{ .AWS_ACCESS_KEY_ID }}" | quote }}
        AWS_SECRET_ACCESS_KEY: {{ "{{ .AWS_SECRET_ACCESS_KEY }}" | quote }}
    {{- end }}
  dataFrom:
    - extract:
        key: secret/data/hub/{{ $identity }}
{{- end }}
{{- end }}
