{{- if eq (int .Values.global.serving.nodesPerReplica) 1 }}
apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: {{ include "vllm-inference-service.fullname" . }}
  annotations:
    {{- toYaml .Values.vllmServingRuntime.annotations | nindent 4 }}
spec:
  multiModel: false
  supportedModelFormats:
    - {name: vLLM, autoSelect: true}
  containers:
    - name: kserve-container
      image: {{ include "aiq.runtimeImage" . | quote }}
      command:
        - python
        - -c
        - |
          {{- .Files.Get "files/single_node.py" | nindent 10 }}
      args:
        {{- include "aiq.args" . | nindent 8 }}
      env:
        {{- include "aiq.runtimeEnv" . | nindent 8 }}
        - {name: AIQ_MODEL_URI, value: {{ include "aiq.uri" . | quote }}}
      ports:
        - {containerPort: 8080, name: http}
      {{- include "aiq.probes" . | nindent 6 }}
      volumeMounts:
        - {name: shm, mountPath: /dev/shm}
        - {name: scratch, mountPath: /tmp}
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        capabilities:
          drop: [ALL]
          {{- if .Values.global.serving.ipcLock }}
          add: [IPC_LOCK]
          {{- end }}
        seccompProfile: {type: RuntimeDefault}
  volumes:
    - name: shm
      emptyDir: {medium: Memory, sizeLimit: {{ .Values.global.serving.shmSize }}}
    - name: scratch
      emptyDir: {}
{{- end }}
