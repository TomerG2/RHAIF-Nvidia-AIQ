apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aiq-serving-isolation
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  podSelector:
    matchLabels:
      aiq.rhai.redhat.com/serving: {{ include "vllm-inference-service.fullname" . }}
  policyTypes: [Ingress]
  ingress:
    # PyTorch/NCCL use multiple dynamic ports. Only this workload's pods may
    # reach internal transport; this policy applies to the primary pod network.
    - from:
        - podSelector:
            matchLabels:
              aiq.rhai.redhat.com/serving: {{ include "vllm-inference-service.fullname" . }}
    - ports: [{protocol: TCP, port: 8080}]
      from:
        - podSelector:
            matchLabels:
              aiq.rhai.redhat.com/model-gate: "true"
        {{- range .Values.global.serving.allowedClientNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
        {{- if .Values.route.enabled }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-ingress
        {{- end }}
