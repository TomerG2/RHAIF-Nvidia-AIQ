{{- include "aiq.validate" . -}}
{{- if eq (int .Values.global.serving.nodesPerReplica) 1 }}
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: {{ include "vllm-inference-service.fullname" . }}
  annotations:
    {{- toYaml .Values.vllmInferenceService.annotations | nindent 4 }}
  labels:
    opendatahub.io/dashboard: 'true'
spec:
  predictor:
    # Release one old replica's GPUs before scheduling its replacement.
    deploymentStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 0
        maxUnavailable: 1
    serviceAccountName: aiq-model-reader
    labels:
      aiq.rhai.redhat.com/serving: {{ include "vllm-inference-service.fullname" . }}
    annotations:
      {{- if .Values.global.serving.networkAttachments }}
      k8s.v1.cni.cncf.io/networks: {{ join "," .Values.global.serving.networkAttachments | quote }}
      {{- end }}
      prometheus.io/scrape: "true"
      prometheus.io/port: "8080"
    minReplicas: {{ .Values.global.serving.replicas }}
    maxReplicas: {{ .Values.global.serving.replicas }}
    model:
      modelFormat: {name: vLLM}
      runtime: {{ include "vllm-inference-service.fullname" . }}
      storageUri: {{ include "aiq.uri" . | quote }}
      resources:
        {{- include "aiq.resources" . | nindent 8 }}
    {{- include "aiq.placement" . | nindent 4 }}
{{- end }}
