# Shared topology and runtime image: values-global.yaml global.serving.
vllmInferenceService:
  annotations:
    openshift.io/display-name: vllm-inference
    serving.kserve.io/deploymentMode: Standard
    argocd.argoproj.io/sync-wave: '20'
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
vllmServingRuntime:
  annotations:
    opendatahub.io/accelerator-name: nvidia-gpu
    opendatahub.io/apiProtocol: REST
    opendatahub.io/recommended-accelerators: '["nvidia.com/gpu"]'
    openshift.io/display-name: vllm-inference
    argocd.argoproj.io/sync-wave: '20'
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  args:
  - --max-model-len=4096
  - --max-num-batched-tokens=8192
  - --dtype=auto
  - --gpu-memory-utilization
  - '0.90'
  - --enforce-eager
  - --moe-backend=marlin
  - --kv-cache-dtype=fp8
  - --enable-prefix-caching
  - --mamba-backend=flashinfer
  - --mamba-cache-mode=align
  - --reasoning-parser=nemotron_v3
  - --enable-auto-tool-choice
  - --tool-call-parser
  - qwen3_coder
route:
  enabled: false
hardwareProfile:
  enabled: false
migration:
  retainLegacyPVC: true
  legacyPVCSize: "" # Set to the EXISTING claim size when switching profiles.
  replaceBackend: true # Retire the opposite backend only after publication/cache gates.
publication:
  scratchSize: 80Gi
  scratchStorageClass: "" # Empty uses the cluster's default storage class.
  timeoutSeconds: 14400
gate:
  timeoutSeconds: 14400
monitoring:
  enabled: true
