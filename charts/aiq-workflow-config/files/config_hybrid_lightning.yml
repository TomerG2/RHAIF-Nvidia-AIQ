general:
  use_uvloop: true
  telemetry:
    logging:
      console:
        _type: console
        level: INFO
  front_end:
    _type: aiq_api
    runner_class: aiq_api.plugin.AIQAPIWorker
    db_url: ${NAT_JOB_STORE_DB_URL:-sqlite+aiosqlite:///./jobs.db}
    expiry_seconds: 86400
    cors:
      allow_origin_regex: http://localhost(:\d+)?|http://127.0.0.1(:\d+)?
      allow_methods:
      - GET
      - POST
      - DELETE
      - OPTIONS
      allow_headers:
      - '*'
      allow_credentials: true
      expose_headers:
      - '*'
llms:
  nemotron_lightning_intent_llm:
    _type: openai
    model_name: {{ .Values.global.model.servedName }}
    base_url: ${AIQ_LIGHTNING_BASE_URL:-{{ include "aiq.localEndpoint" . }}}
    api_key: ${VLLM_API_KEY}
    temperature: 0.1
    top_p: 0.9
    max_tokens: 1024
    num_retries: 5
    parallel_tool_calls: false
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
  nemotron_lightning_agent_llm:
    _type: openai
    model_name: {{ .Values.global.model.servedName }}
    base_url: ${AIQ_LIGHTNING_BASE_URL:-{{ include "aiq.localEndpoint" . }}}
    api_key: ${VLLM_API_KEY}
    temperature: 0.2
    top_p: 0.7
    max_tokens: {{ .Values.workflowProfile.lightningAgent.maxTokens }}
    num_retries: 5
    parallel_tool_calls: false
    extra_body:
      chat_template_kwargs:
        enable_thinking: true
      {{ if .Values.workflowProfile.lightningAgent.thinkingTokenBudget }}
      thinking_token_budget: {{ .Values.workflowProfile.lightningAgent.thinkingTokenBudget }}
      {{ end }}
  nemotron_ultra_llm:
    _type: nim
    model_name: nvidia/nemotron-3-super-120b-a12b
    base_url: https://integrate.api.nvidia.com/v1
    api_key: ${NVIDIA_API_KEY}
    temperature: 0.2
    top_p: 0.7
    max_tokens: 16384
    num_retries: 5
    chat_template_kwargs:
      enable_thinking: false
  nemotron_ultra_writer_llm:
    _type: nim
    model_name: nvidia/nemotron-3-super-120b-a12b
    base_url: https://integrate.api.nvidia.com/v1
    api_key: ${NVIDIA_API_KEY}
    temperature: 0.2
    top_p: 0.7
    max_tokens: 32768
    num_retries: 5
    chat_template_kwargs:
      enable_thinking: false
functions:
  data_sources:
    _type: data_source_registry
    sources:
    - id: web_search
      name: Web Search
      description: Search the web for real-time information.
      tools:
      - web_search_tool
      - advanced_web_search_tool
  web_search_tool:
    _type: tavily_web_search
    max_results: 5
    max_content_length: 1000
  advanced_web_search_tool:
    _type: tavily_web_search
    max_results: 2
    advanced_search: true
  intent_classifier:
    _type: intent_classifier
    llm: nemotron_lightning_intent_llm
  clarifier_agent:
    _type: clarifier_agent
    llm: nemotron_ultra_llm
    max_turns: 3
    log_response_max_chars: 2000
  shallow_research_agent:
    _type: shallow_research_agent
    llm: nemotron_lightning_agent_llm
    exclude_tools:
    - advanced_web_search_tool
    max_llm_turns: 10
    max_tool_iterations: 5
  deep_research_agent:
    _type: deep_research_agent
    enable_citation_verification: true
    orchestrator_llm: nemotron_ultra_llm
    source_router_llm: nemotron_ultra_llm
    researcher_llm: nemotron_ultra_llm
    planner_llm: nemotron_ultra_llm
    writer_llm: nemotron_ultra_writer_llm
    exclude_tools:
    - web_search_tool
workflow:
  _type: chat_deepresearcher_agent
  enable_escalation: true
  enable_clarifier: true
  use_async_deep_research: true
  checkpoint_db: ${AIQ_CHECKPOINT_DB:-./checkpoints.db}
