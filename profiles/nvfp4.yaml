#
# NVFP4 quantized checkpoint with small token budgets.
# Quantization comes from the checkpoint config.json.
# Keep vllmServingRuntime.args aligned with charts/all/vllm-inference-service/values.yaml.
# Example Phase 0 worker: one NVIDIA L4 (AWS g6.2xlarge).
global:
  model:
    hfRepo: nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4
    servedName: nemotron-3.5-lightning-30b-a3b
vllmInferenceService:
  predictor:
    resources:
      limits:
        nvidia.com/gpu: "1"
vllmServingRuntime:
  args:
    - "--model=/cache/models"
    - "--distributed-executor-backend=mp"
    - "--max-model-len=4096"
    - "--max-num-batched-tokens=8192"
    - "--dtype=auto"
    - "--gpu-memory-utilization"
    - "0.90"
    - "--enforce-eager"
    - "--moe-backend=marlin"
    - "--kv-cache-dtype=fp8"
    - "--enable-prefix-caching"
    - "--mamba-backend=flashinfer"
    - "--mamba-cache-mode=align"
    - "--reasoning-parser=nemotron_v3"
    # qwen3_coder is NVIDIA's vLLM tool parser for Nemotron (not a Qwen model).
    - "--enable-auto-tool-choice"
    - "--tool-call-parser"
    - "qwen3_coder"
workflowProfile:
  lightningAgent:
    maxTokens: 1536
    thinkingTokenBudget: 512
