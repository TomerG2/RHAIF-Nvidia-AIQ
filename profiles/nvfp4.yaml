# Serving preset; topology and resource arithmetic live in global.serving.
global:
  model:
    hfRepo: nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4
    servedName: nemotron-3.5-lightning-30b-a3b
    revision: bee7596271d1495f6992ae224aefde4410e816b8
    size: 80Gi
  serving:
    gpusPerNode: 1
    tensorParallel: 1
vllmServingRuntime:
  args:
  - --max-model-len=4096
  - --max-num-batched-tokens=8192
  - --dtype=auto
  - --gpu-memory-utilization
  - '0.90'
  - --enforce-eager
  - --moe-backend=marlin
  - --kv-cache-dtype=fp8
  - --enable-prefix-caching
  - --mamba-backend=flashinfer
  - --mamba-cache-mode=align
  - --reasoning-parser=nemotron_v3
  - --enable-auto-tool-choice
  - --tool-call-parser
  - qwen3_coder
workflowProfile:
  lightningAgent:
    maxTokens: 1536
    thinkingTokenBudget: 512
