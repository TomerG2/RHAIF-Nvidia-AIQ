# Serving preset; topology and resource arithmetic live in global.serving.
global:
  model:
    hfRepo: nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-BF16
    servedName: nemotron-3.5-lightning-30b-a3b-bf16
    revision: a9904d24bcc1d289a1950fa9d2b978c47cf903b9
    size: 150Gi
  serving:
    gpusPerNode: 4
    tensorParallel: 4
    cpu: "16"
    memory: 64Gi
    shmSize: 8Gi
  modelCache:
    capacity: 350Gi
vllmServingRuntime:
  args:
  - --max-model-len=65536
  - --max-num-batched-tokens=32768
  - --dtype=auto
  - --gpu-memory-utilization
  # RHOAI vLLM 0.24.0+rhaiv.13 profiles CUDA graphs before allocating KV cache.
  # Four 24 GB L4s need this budget to retain the existing 65536-token context.
  - '0.95'
  - --enable-prefix-caching
  - --mamba-backend=flashinfer
  - --mamba-cache-mode=align
  - --reasoning-parser=nemotron_v3
  - --enable-auto-tool-choice
  - --tool-call-parser
  - qwen3_coder
workflowProfile:
  lightningAgent:
    maxTokens: 32768
    thinkingTokenBudget: 0
