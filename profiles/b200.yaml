# Four independent BF16 replicas on four B200 nodes, eight GPUs per replica.
# TP stays within each node; requests are distributed across the four replicas.
# Configuration preset; B200 runtime, memory headroom, and throughput need validation.
global:
  model:
    hfRepo: nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-BF16
    servedName: nemotron-3.5-lightning-30b-a3b-bf16
    revision: a9904d24bcc1d289a1950fa9d2b978c47cf903b9
    size: 150Gi
  serving:
    replicas: 4
    nodesPerReplica: 1
    gpusPerNode: 8
    tensorParallel: 8
    pipelineParallel: 1
    cpu: "32"
    memory: 256Gi
    shmSize: 32Gi
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-B200
  modelCache:
    capacity: 350Gi
vllmServingRuntime:
  args:
  # The pinned checkpoint declares max_position_embeddings=262144.
  - --max-model-len=262144
  - --max-num-batched-tokens=65536
  # Long prompts must be chunked because the per-iteration budget is smaller.
  - --enable-chunked-prefill
  - --dtype=auto
  - --gpu-memory-utilization
  - '0.90'
  - --enable-prefix-caching
  - --mamba-backend=flashinfer
  - --mamba-cache-mode=align
  - --reasoning-parser=nemotron_v3
  - --enable-auto-tool-choice
  - --tool-call-parser
  - qwen3_coder
workflowProfile:
  lightningAgent:
    maxTokens: 65536
    thinkingTokenBudget: 0
